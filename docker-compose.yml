version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: devopsverse-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: devopsverse
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7
    container_name: devopsverse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mongodb_data: